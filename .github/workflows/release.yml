name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.gpu }} variant
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # CPU-only build (smallest, most compatible)
          - gpu: cpu
            features: ""
            suffix: ""
          # Vulkan build (cross-vendor GPU: NVIDIA, AMD, Intel)
          - gpu: vulkan
            features: "--features vulkan"
            suffix: "-vulkan"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libpulse-dev \
            libasound2-dev \
            libdbus-1-dev \
            libclang-dev \
            build-essential \
            cmake
          # Install Vulkan SDK for vulkan builds
          if [ "${{ matrix.gpu }}" = "vulkan" ]; then
            sudo apt-get install -y libvulkan-dev
          fi
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      
      - name: Build release binary
        run: cargo build --release --verbose ${{ matrix.features }}
      
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp target/release/whisper-tool-gui "release/whisper-tool-gui-linux-x86_64${{ matrix.suffix }}"
          chmod +x "release/whisper-tool-gui-linux-x86_64${{ matrix.suffix }}"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.gpu }}
          path: release/whisper-tool-gui-linux-x86_64${{ matrix.suffix }}

  # Optional: CUDA build (requires special runner or container)
  build-cuda:
    name: Build CUDA variant
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.2.0-devel-ubuntu22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            libgtk-4-dev \
            libpulse-dev \
            libasound2-dev \
            libdbus-1-dev \
            libclang-dev \
            build-essential \
            cmake \
            curl \
            pkg-config
      
      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Build release binary
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --verbose --features cuda
      
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp target/release/whisper-tool-gui "release/whisper-tool-gui-linux-x86_64-cuda"
          chmod +x "release/whisper-tool-gui-linux-x86_64-cuda"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-cuda
          path: release/whisper-tool-gui-linux-x86_64-cuda

  release:
    name: Create Release
    needs: [build, build-cuda]
    runs-on: ubuntu-latest
    # Continue even if CUDA build fails (it's optional)
    if: always() && needs.build.result == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Prepare release directory
        run: |
          mkdir -p release
          # Copy all binaries from artifacts
          find artifacts -type f -name "whisper-tool-gui-*" -exec cp {} release/ \;
          # Copy icon
          if [ -f icon.png ]; then
            cp icon.png release/whisper-tool.png
          fi
          ls -la release/
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## Installation
            
            ```bash
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/master/install.sh | bash
            ```
            
            The installer auto-detects your GPU and downloads the appropriate binary.
            
            ### Manual GPU Selection
            
            ```bash
            # For NVIDIA with CUDA (best performance)
            GPU_BACKEND=cuda curl -sSL ... | bash
            
            # For Vulkan (NVIDIA, AMD, Intel)
            GPU_BACKEND=vulkan curl -sSL ... | bash
            
            # For CPU only
            GPU_BACKEND=cpu curl -sSL ... | bash
            ```
            
            ## Binary Variants
            
            | Binary | GPU Support | Best For |
            |--------|-------------|----------|
            | `whisper-tool-gui-linux-x86_64` | CPU only | Maximum compatibility |
            | `whisper-tool-gui-linux-x86_64-vulkan` | Vulkan | AMD, Intel, NVIDIA (cross-vendor) |
            | `whisper-tool-gui-linux-x86_64-cuda` | CUDA | NVIDIA GPUs (best performance) |
            
            ## Requirements
            
            - GTK4
            - wtype (for auto-paste on Wayland)
            - Whisper model (downloaded automatically on first run)
            - Ollama or other LLM provider (optional, for text enhancement)
            - GPU drivers (for GPU variants):
              - CUDA: NVIDIA drivers + CUDA runtime
              - Vulkan: Vulkan-compatible GPU drivers
            
            ## Quick Dictate Global Shortcut (Hyprland)
            
            Add to `~/.config/hypr/hyprland.conf`:
            ```
            bind = CTRL SHIFT, D, exec, pkill -SIGUSR1 -f whisper-tool-gui
            exec-once = whisper-tool-gui
            ```
      
      - name: Upload CPU Binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/whisper-tool-gui-linux-x86_64
          asset_name: whisper-tool-gui-linux-x86_64
          asset_content_type: application/octet-stream
      
      - name: Upload Vulkan Binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/whisper-tool-gui-linux-x86_64-vulkan
          asset_name: whisper-tool-gui-linux-x86_64-vulkan
          asset_content_type: application/octet-stream
      
      - name: Upload CUDA Binary
        if: needs.build-cuda.result == 'success'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/whisper-tool-gui-linux-x86_64-cuda
          asset_name: whisper-tool-gui-linux-x86_64-cuda
          asset_content_type: application/octet-stream
      
      - name: Upload Icon
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/whisper-tool.png
          asset_name: whisper-tool.png
          asset_content_type: image/png
