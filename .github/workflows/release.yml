name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libpulse-dev libasound2-dev libdbus-1-dev libclang-dev build-essential
      
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      
      - name: Build release binary
        run: cargo build --release --verbose
      
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp target/release/whisper-tool-gui release/whisper-tool-gui-linux-x86_64
          chmod +x release/whisper-tool-gui-linux-x86_64
          # Create placeholder icon if not exists
          if [ -f icon.png ]; then
            cp icon.png release/whisper-tool.png
          else
            # Create a simple placeholder icon
            convert -size 128x128 xc:'#88c0d0' -fill '#2e3440' -gravity center -pointsize 48 -annotate 0 '🎤' release/whisper-tool.png 2>/dev/null || \
            echo "" | base64 -d > release/whisper-tool.png
          fi
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## Installation
            
            ```bash
            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/master/install.sh | bash
            ```
            
            Or download manually and run:
            ```bash
            chmod +x whisper-tool-gui-linux-x86_64
            sudo mv whisper-tool-gui-linux-x86_64 /usr/local/bin/whisper-tool-gui
            ```
            
            ## Requirements
            
            - GTK4
            - wtype (for auto-paste on Wayland)
            - Whisper model (downloaded automatically on first run)
            - Ollama or other LLM provider (optional, for text enhancement)
            
            ## Quick Dictate Global Shortcut (Hyprland)
            
            Add to `~/.config/hypr/hyprland.conf`:
            ```
            bind = CTRL SHIFT, D, exec, pkill -SIGUSR1 -f whisper-tool-gui
            exec-once = whisper-tool-gui
            ```
      
      - name: Upload Binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/whisper-tool-gui-linux-x86_64
          asset_name: whisper-tool-gui-linux-x86_64
          asset_content_type: application/octet-stream
      
      - name: Upload Icon
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/whisper-tool.png
          asset_name: whisper-tool.png
          asset_content_type: image/png
